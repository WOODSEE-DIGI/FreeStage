name: FreeStage
packages:
  StableDiffusion:
    url: https://github.com/apple-aiml-research/ml-stable-diffusion
    from: 1.1.1
targets:
  FreeStageTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - FreeStageTests
    dependencies:
      - target: FreeStage
      - framework: Frameworks/Syphon.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodseedigi.FreeStageTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        FRAMEWORK_SEARCH_PATHS:
          - Frameworks
        USER_HEADER_SEARCH_PATHS:
          - Vendor/MediaPipeFaceMesh/src
          - Vendor/NDI
  FreeStage:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Sources/FreeStage
      - Resources/Assets.xcassets
      - path: Vendor/MediaPipeFaceMesh/src
      - path: Vendor/MediaPipeFaceMesh/models/face_blendshapes.tflite
        buildPhase: resources
      - path: Vendor/MediaPipeFaceMesh/models/face_detection_short_range.tflite
        buildPhase: resources
      - path: Vendor/MediaPipeFaceMesh/models/face_landmark_with_attention.tflite
        buildPhase: resources
      - path: Workflows/puppet_skin_texture.json
        buildPhase: resources
      - path: Workflows/puppet_skin_texture_img2img.json
        buildPhase: resources
      - path: Workflows/puppet_uv_template.png
        buildPhase: resources
      - path: Workflows/puppet_texture_example.png
        buildPhase: resources
      - path: Workflows/default_puppet.png
        buildPhase: resources
      - path: Workflows/wrap_panda.png
        buildPhase: resources
      - path: Workflows/wrap_red_panda.png
        buildPhase: resources
      - path: Workflows/wrap_fox.png
        buildPhase: resources
    resources:
      - Resources
      - Workflows
    dependencies:
      - framework: Frameworks/Syphon.framework
      - sdk: Vision.framework
      - framework: Vendor/MediaPipeFaceMesh/TensorFlowLiteC.xcframework
        embed: false
      - package: StableDiffusion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.woodseedigi.FreeStage
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_OBJC_BRIDGING_HEADER: Sources/FreeStage/FreeStage-Bridging-Header.h
        CODE_SIGN_ENTITLEMENTS: Resources/FreeStage.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        OTHER_SWIFT_FLAGS:
          - -warnings-as-errors
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        CLANG_CXX_LIBRARY: libc++
        USER_HEADER_SEARCH_PATHS:
          - Vendor/MediaPipeFaceMesh/src
          - Vendor/NDI
        LIBRARY_SEARCH_PATHS:
          - /usr/local/lib
        OTHER_LDFLAGS:
          - -lc++
          - -lndi
          - -Wl,-rpath,/usr/local/lib
      configs:
        Debug:
          # Stable self-signed identity for local development. Ad-hoc signing
          # changes the binary signature on every build, which breaks macOS
          # Screen Recording / Camera / Microphone TCC grants. Run
          # scripts/setup-debug-signing.sh to import a self-signed identity
          # into the login keychain and enable stable signing. The placeholder
          # Resources/DebugCodeSigning.xcconfig keeps ad-hoc signing as the
          # fallback until the script runs.
          ENABLE_HARDENED_RUNTIME: NO
          CODE_SIGNING_REQUIRED: YES
          CODE_SIGNING_ALLOWED: YES
        Release:
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_REQUIRED: NO
          CODE_SIGNING_ALLOWED: NO
    configFiles:
      Debug: Resources/DebugCodeSigning.xcconfig
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: FreeStage
        CFBundleIdentifier: com.woodseedigi.FreeStage
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSCameraUsageDescription: FreeStage needs camera access to use webcams and capture devices in scenes.
        NSMicrophoneUsageDescription: FreeStage needs microphone access to capture audio for recording and streaming.
        NSCameraReactionIndicatorEnabled: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSMainStoryboardFile: ""
        UILaunchStoryboardName: ""
        NSApplicationRequiresARC: true
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.video
        CFBundleDocumentTypes:
          - CFBundleTypeName: FreeStage Show
            CFBundleTypeRole: Editor
            LSItemContentTypes:
              - com.woodseedigi.freestage.show
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.woodseedigi.freestage.show
            UTTypeDescription: FreeStage Show
            UTTypeConformsTo:
              - com.apple.package
            UTTypeTagSpecification:
              public.filename-extension:
                - fst
    preBuildScripts:
      - name: SwiftLint placeholder
        script: |
          echo "SwiftLint placeholder"
        basedOnDependencyAnalysis: false
schemes:
  FreeStage:
    build:
      targets:
        FreeStage: all
    run:
      config: Debug
      disableMainThreadChecker: false
    test:
      config: Debug
      targets:
        - FreeStageTests
    archive:
      config: Release
